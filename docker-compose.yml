services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment_gateway
      POSTGRES_PASSWORD: payment_gateway
      POSTGRES_DB: payment_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
