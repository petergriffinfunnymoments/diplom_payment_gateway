<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата заказа</title>
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Оплата заказа</h1>
      <p class="muted">Студенческая демо-страница для интеграции с платежным шлюзом</p>
    </header>

    <section class="card">
      <form id="paymentForm" class="form" novalidate>
        <div class="grid-2">
          <label class="field">
            <span>Сумма (RUB)</span>
            <input
              id="amount"
              name="amount"
              type="number"
              step="0.01"
              min="1"
              max="1000000"
              value="1500"
              required
              inputmode="decimal"
              title="Введите сумму от 1 до 1 000 000 рублей"
            />
          </label>

          <label class="field">
            <span>Валюта</span>
            <select id="currency" name="currency" required>
              <option value="RUB" selected>RUB</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Описание</span>
          <input
            id="description"
            name="description"
            type="text"
            value="Оплата заказа №67890"
            required
            minlength="3"
            maxlength="255"
            title="Описание должно быть от 3 до 255 символов"
          />
        </label>

        <div class="grid-2">
          <label class="field">
            <span>Email</span>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="customer@example.com"
              autocomplete="email"
              title="Введите email в формате customer@example.com"
            />
          </label>

          <label class="field">
            <span>Телефон</span>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+79991234567"
              maxlength="12"
              pattern="^\+7\d{10}$"
              title="Телефон должен быть в формате +79991234567"
            />
          </label>
        </div>

        <hr />

        <div class="method">
          <h2>Способ оплаты</h2>

          <div class="radioRow">
            <label class="radio">
              <input type="radio" name="paymentMethod" value="СБП" checked />
              <span>СБП</span>
            </label>
            <label class="radio">
              <input type="radio" name="paymentMethod" value="Банковская карта" />
              <span>Банковская карта</span>
            </label>
            <label class="radio">
              <input type="radio" name="paymentMethod" value="Цифровой кошелек" />
              <span>Цифровой кошелек</span>
            </label>
          </div>
        </div>

        <div id="sbpFields" class="methodFields">
          <label class="field">
            <span>Номер телефона для СБП</span>
            <input
              id="sbpPhone"
              name="sbpPhone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="+79991234567"
              maxlength="12"
              pattern="^\+7\d{10}$"
              title="Телефон для СБП должен быть в формате +79991234567"
            />
          </label>
        </div>

        <div id="cardFields" class="methodFields hidden">
          <div class="grid-2">
            <label class="field">
              <span>Номер карты</span>
              <input
                id="cardNumber"
                name="cardNumber"
                type="text"
                inputmode="numeric"
                autocomplete="cc-number"
                placeholder="4111111111111111"
                maxlength="19"
                pattern="^\d{16,19}$"
                title="Номер карты должен содержать от 16 до 19 цифр"
              />
              <small id="cardSchemeHint" class="card-scheme-hint">Платёжная система карты: не определена</small>
            </label>

            <label class="field">
              <span>Срок (ММ/ГГ)</span>
              <input
                id="cardDate"
                name="cardDate"
                type="text"
                inputmode="numeric"
                autocomplete="cc-exp"
                placeholder="12/29"
                maxlength="5"
                pattern="^(0[1-9]|1[0-2])\/\d{2}$"
                title="Срок карты должен быть в формате ММ/ГГ, например 12/29"
              />
            </label>
          </div>

          <label class="field">
            <span>CVV</span>
            <input
              id="cvv"
              name="cvv"
              type="password"
              inputmode="numeric"
              autocomplete="cc-csc"
              placeholder="123"
              maxlength="3"
              pattern="^\d{3}$"
              title="CVV должен содержать ровно 3 цифры"
            />
          </label>
        </div>

        <div id="walletFields" class="methodFields hidden">
          <label class="field">
            <span>ID цифрового кошелька</span>
            <input
              id="walletId"
              name="walletId"
              type="text"
              placeholder="wallet_123"
              minlength="3"
              maxlength="64"
              pattern="^[A-Za-z0-9_-]{3,64}$"
              title="ID кошелька может содержать латинские буквы, цифры, _ и -, от 3 до 64 символов"
            />
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn" id="payBtn">
            Оплатить
          </button>
          <button type="button" class="btn btn-secondary" id="fillDemoBtn">
            Заполнить демо-данные
          </button>
        </div>

        <div id="statusBox" class="status hidden" aria-live="polite"></div>

      </form>
    </section>


    <section class="card">
      <h2>Проверка статуса платежа</h2>
      <p class="muted">Введите payment_id или используйте последний созданный платеж.</p>
      <div class="grid-2">
        <label class="field">
          <span>Payment ID</span>
          <input id="statusPaymentId" type="text" placeholder="pay_..." />
        </label>
        <label class="field">
          <span>Merchant ID</span>
          <input id="statusMerchantId" type="text" value="merchant_12345" />
        </label>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-secondary" id="checkStatusBtn">
          Проверить статус
        </button>
      </div>
    </section>

    <section class="card">
      <h2>Ответ шлюза</h2>
      <pre id="responseBox" class="response hidden"></pre>
    </section>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
