<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата заказа</title>
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Оплата заказа</h1>
      <p class="muted">Студенческая демо-страница для интеграции с платежным шлюзом</p>
    </header>

    <section class="card">
      <form id="paymentForm" class="form">
        <div class="grid-2">
          <label class="field">
            <span>Сумма (RUB)</span>
            <input id="amount" name="amount" type="number" step="0.01" min="0" value="1500" required />
          </label>

          <label class="field">
            <span>Валюта</span>
            <select id="currency" name="currency">
              <option value="RUB" selected>RUB</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Описание</span>
          <input id="description" name="description" type="text" value="Оплата заказа №67890" required />
        </label>

        <div class="grid-2">
          <label class="field">
            <span>Email</span>
            <input id="email" name="email" type="email" placeholder="customer@example.com" />
          </label>

          <label class="field">
            <span>Телефон</span>
            <input id="phone" name="phone" type="tel" placeholder="+79991234567" />
          </label>
        </div>

        <hr />

        <div class="method">
          <h2>Способ оплаты</h2>

          <div class="radioRow">
            <label class="radio">
              <input type="radio" name="paymentMethod" value="СБП" checked />
              <span>СБП</span>
            </label>
            <label class="radio">
              <input type="radio" name="paymentMethod" value="Банковская карта" />
              <span>Банковская карта</span>
            </label>
            <label class="radio">
              <input type="radio" name="paymentMethod" value="Цифровой кошелек" />
              <span>Цифровой кошелек</span>
            </label>
          </div>
        </div>

        <div id="sbpFields" class="methodFields">
          <label class="field">
            <span>Номер телефона для СБП</span>
            <input id="sbpPhone" name="sbpPhone" type="tel" placeholder="+79991234567" />
          </label>
        </div>

        <div id="cardFields" class="methodFields hidden">
          <div class="grid-2">
            <label class="field">
              <span>Номер карты</span>
              <input id="cardNumber" name="cardNumber" type="text" inputmode="numeric" placeholder="4111111111111111" />
            </label>

            <label class="field">
              <span>Срок (ММ/ГГ)</span>
              <input id="cardDate" name="cardDate" type="text" placeholder="12/29" />
            </label>
          </div>

          <label class="field">
            <span>CVV</span>
            <input id="cvv" name="cvv" type="password" inputmode="numeric" placeholder="123" />
          </label>
        </div>

        <div id="walletFields" class="methodFields hidden">
          <label class="field">
            <span>ID цифрового кошелька</span>
            <input id="walletId" name="walletId" type="text" placeholder="wallet_123" />
          </label>
        </div>

        <div class="actions">
          <button type="submit" class="btn" id="payBtn">
            Оплатить
          </button>
          <button type="button" class="btn btn-secondary" id="fillDemoBtn">
            Заполнить демо-данные
          </button>
        </div>

        <div id="statusBox" class="status hidden" aria-live="polite"></div>

      </form>
    </section>

    <section class="card">
      <h2>Ответ шлюза</h2>
      <pre id="responseBox" class="response hidden"></pre>
    </section>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
